<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:#eef1f4;font-family:'Noto Sans JP',sans-serif;color:#22303c;-webkit-font-smoothing:antialiased}
  a{color:#2c5f9e;text-decoration:none}
  a:hover{color:#1f4a80}
  @keyframes rowin{from{background:#fff2c9}to{background:transparent}}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#c7d0d9;border-radius:6px;border:2px solid transparent;background-clip:padding-box}
  ::-webkit-scrollbar-thumb:hover{background:#aab5c0;background-clip:padding-box}
</style>
</helmet>

<div style="display:flex;min-height:100vh;">
  <!-- SIDEBAR -->
  <aside style="flex:none;width:210px;background:#fff;border-right:1px solid #dde4ea;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;">
    <div style="display:flex;align-items:center;gap:9px;padding:16px 16px 14px;border-bottom:1px solid #eef2f5;">
      <span style="display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;background:{{ accent }};color:#fff;border-radius:8px;font-family:'Zen Kaku Gothic New',sans-serif;font-weight:700;font-size:16px;">会</span>
      <span style="font-family:'Zen Kaku Gothic New',sans-serif;font-weight:700;font-size:15px;line-height:1.2;">会計基準<br>システム</span>
    </div>
    <nav style="flex:1;overflow-y:auto;padding:8px 6px;display:flex;flex-direction:column;">
      <sc-for list="{{ menuGroups }}" as="g" hint-placeholder-count="11">
        <div style="{{ g.groupStyle }}">
          <sc-for list="{{ g.items }}" as="it" hint-placeholder-count="3">
            <button type="button" style="{{ it.style }}" style-hover="background:#f4f6f8;">{{ it.label }}</button>
          </sc-for>
        </div>
      </sc-for>
    </nav>
    <div style="padding:12px 16px;border-top:1px solid #eef2f5;display:flex;align-items:center;gap:8px;font-size:12.5px;color:#8895a3;cursor:pointer;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
      <span>閉じる</span>
    </div>
  </aside>

  <!-- MAIN -->
  <div style="flex:1;min-width:0;display:flex;flex-direction:column;">
    <!-- top bar -->
    <header style="position:sticky;top:0;z-index:100;background:#fff;border-bottom:1px solid #dde4ea;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;flex:none;">
      <div style="display:flex;align-items:center;gap:8px;font-size:13.5px;color:#8895a3;">
        <span>ホーム</span><span style="color:#c3ccd4;">›</span>
        <span>会計帳簿</span><span style="color:#c3ccd4;">›</span>
        <span style="color:#22303c;font-weight:700;font-family:'Zen Kaku Gothic New',sans-serif;">仕訳帳</span>
      </div>
      <div style="display:flex;align-items:center;gap:18px;font-size:13px;color:#68757f;">
        <span>令和8年度（1/1〜12/31）</span>
        <span style="color:#c3ccd4;">｜</span>
        <span>チャイルド保育園　拠点区分</span>
        <span style="display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;background:#eaf0f7;color:{{ accent }};font-size:13px;font-weight:700;">経</span>
      </div>
    </header>

    <!-- SEARCH -->
    <div style="background:#fff;border-bottom:1px solid #dde4ea;padding:16px 24px 18px;flex:none;">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:13px;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="{{ accent }}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="M21 21l-4.3-4.3"></path></svg>
        <span style="font-family:'Zen Kaku Gothic New',sans-serif;font-weight:700;font-size:14px;">仕訳を検索</span>
      </div>
      <div style="display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;">
        <div style="flex:1;min-width:220px;">
          <label style="display:block;font-size:10.5px;font-weight:600;color:#8290a0;margin-bottom:5px;">キーワード</label>
          <input data-field="keyword" value="{{ search.keyword }}" onInput="{{ onSearchInput }}" onKeyDown="{{ onSearchKey }}" placeholder="勘定科目・摘要で検索" autocomplete="off" style="width:100%;padding:9px 11px;border:1px solid #cfd8e0;border-radius:8px;font-size:13px;font-family:inherit;outline:none;color:#22303c;" style-focus="border-color:#2c5f9e;box-shadow:0 0 0 3px rgba(44,95,158,.10);" />
        </div>
        <div style="width:190px;">
          <label style="display:block;font-size:10.5px;font-weight:600;color:#2c5f9e;margin-bottom:5px;">借方勘定科目</label>
          <select data-field="kari" value="{{ search.kari }}" onChange="{{ onSearchInput }}" style="width:100%;padding:9px 10px;border:1px solid #cfd8e0;border-radius:8px;font-size:13px;font-family:inherit;outline:none;background:#fff;color:#22303c;cursor:pointer;">
            <option value="">全て</option>
            <sc-for list="{{ accountOptions }}" as="o" hint-placeholder-count="6">
              <option value="{{ o }}">{{ o }}</option>
            </sc-for>
          </select>
        </div>
        <div style="width:190px;">
          <label style="display:block;font-size:10.5px;font-weight:600;color:#b0426a;margin-bottom:5px;">貸方勘定科目</label>
          <select data-field="kashi" value="{{ search.kashi }}" onChange="{{ onSearchInput }}" style="width:100%;padding:9px 10px;border:1px solid #cfd8e0;border-radius:8px;font-size:13px;font-family:inherit;outline:none;background:#fff;color:#22303c;cursor:pointer;">
            <option value="">全て</option>
            <sc-for list="{{ accountOptions }}" as="o" hint-placeholder-count="6">
              <option value="{{ o }}">{{ o }}</option>
            </sc-for>
          </select>
        </div>
        <div>
          <label style="display:block;font-size:10.5px;font-weight:600;color:#8290a0;margin-bottom:5px;">金額</label>
          <div style="display:flex;align-items:center;gap:6px;">
            <input data-field="amountMin" value="{{ search.amountMin }}" onInput="{{ onSearchInput }}" onKeyDown="{{ onSearchKey }}" inputmode="numeric" placeholder="下限" style="width:104px;text-align:right;padding:9px 10px;border:1px solid #cfd8e0;border-radius:8px;font-size:13px;font-family:inherit;outline:none;background:#fff;color:#22303c;font-variant-numeric:tabular-nums;" style-focus="border-color:#2c5f9e;" />
            <span style="color:#9aa5b1;">〜</span>
            <input data-field="amountMax" value="{{ search.amountMax }}" onInput="{{ onSearchInput }}" onKeyDown="{{ onSearchKey }}" inputmode="numeric" placeholder="上限" style="width:104px;text-align:right;padding:9px 10px;border:1px solid #cfd8e0;border-radius:8px;font-size:13px;font-family:inherit;outline:none;background:#fff;color:#22303c;font-variant-numeric:tabular-nums;" style-focus="border-color:#2c5f9e;" />
          </div>
        </div>
        <div style="display:flex;gap:9px;">
          <button type="button" onClick="{{ clearSearch }}" style="padding:9px 18px;border:1px solid #cfd8e0;border-radius:8px;background:#fff;color:#5b6773;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;" style-hover="border-color:#aab5c0;">クリア</button>
          <button type="button" onClick="{{ doSearch }}" style="{{ searchBtnStyle }}" style-hover="filter:brightness(.92);">検索</button>
        </div>
      </div>
    </div>

    <!-- CONTENT -->
    <main style="flex:1;min-height:0;padding:20px 24px 24px;display:flex;">
      <div style="width:100%;background:#fff;border:1px solid #dde4ea;border-radius:14px;box-shadow:0 6px 26px rgba(30,50,70,.06);overflow:hidden;display:flex;flex-direction:column;">
        <!-- ENTRY BAR -->
        <div style="padding:16px 22px 18px;border-bottom:1px solid #eef2f5;flex:none;">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:13px;">
            <div style="font-family:'Zen Kaku Gothic New',sans-serif;font-weight:700;font-size:16px;">新規仕訳の入力</div>
            <div style="display:flex;align-items:center;gap:12px;">
              <span style="font-size:11px;color:#8895a3;">取引区分</span>
              <div style="display:flex;gap:6px;">
                <sc-for list="{{ torihiki }}" as="chip" hint-placeholder-count="3">
                  <button type="button" onClick="{{ chip.onClick }}" style="{{ chip.style }}">{{ chip.label }}</button>
                </sc-for>
              </div>
            </div>
          </div>
          <div style="display:flex;flex-wrap:wrap;gap:12px;align-items:end;">
            <div style="width:130px;flex:none;">
              <label style="display:block;font-size:10.5px;font-weight:600;color:#8290a0;margin-bottom:6px;">日付（月/日）</label>
              <div style="display:flex;align-items:center;gap:4px;">
                <input data-field="month" value="{{ form.month }}" onInput="{{ onFieldInput }}" inputmode="numeric" style="width:46px;padding:9px 4px;text-align:center;border:1px solid #cfd8e0;border-radius:8px;font-size:14px;font-family:inherit;outline:none;background:#fff;color:#22303c;" style-focus="border-color:#2c5f9e;" />
                <span style="color:#9aa5b1;">/</span>
                <input data-field="day" value="{{ form.day }}" onInput="{{ onFieldInput }}" inputmode="numeric" style="width:46px;padding:9px 4px;text-align:center;border:1px solid #cfd8e0;border-radius:8px;font-size:14px;font-family:inherit;outline:none;background:#fff;color:#22303c;" style-focus="border-color:#2c5f9e;" />
              </div>
            </div>
            <div style="flex:1;min-width:190px;">
              <label style="display:block;font-size:10.5px;font-weight:600;color:#2c5f9e;margin-bottom:6px;">借方科目</label>
              <div style="position:relative;" data-assist>
                <button type="button" data-field="kariKamoku" data-type="account" onClick="{{ openAssist }}" style="display:flex;align-items:center;justify-content:space-between;gap:6px;width:100%;box-sizing:border-box;padding:10px 11px;background:#fff;border:1px solid #cfd8e0;border-radius:8px;font-size:14px;font-family:inherit;cursor:pointer;text-align:left;color:inherit;" style-hover="border-color:#2c5f9e;box-shadow:0 0 0 3px rgba(44,95,158,.10);">
                  <span style="{{ fields.kariKamoku.style }}">{{ fields.kariKamoku.text }}</span>
                  <span style="color:#9aa5b1;font-size:9px;flex:none;">▼</span>
                </button>
                <sc-if value="{{ active.kariKamoku }}" hint-placeholder-val="{{ false }}">
                  <dc-import name="AssistPanel" groups="{{ assistGroups }}" query="{{ assist.query }}" empty="{{ assistEmpty }}" on-input="{{ onQueryInput }}" on-pick="{{ onPick }}" hint-size="270px,280px" style="position:absolute;top:calc(100% + 6px);left:0;width:100%;min-width:260px;z-index:60;"></dc-import>
                </sc-if>
              </div>
            </div>
            <div style="flex:1;min-width:190px;">
              <label style="display:block;font-size:10.5px;font-weight:600;color:#b0426a;margin-bottom:6px;">貸方科目</label>
              <div style="position:relative;" data-assist>
                <button type="button" data-field="kashiKamoku" data-type="account" onClick="{{ openAssist }}" style="display:flex;align-items:center;justify-content:space-between;gap:6px;width:100%;box-sizing:border-box;padding:10px 11px;background:#fff;border:1px solid #cfd8e0;border-radius:8px;font-size:14px;font-family:inherit;cursor:pointer;text-align:left;color:inherit;" style-hover="border-color:#b0426a;box-shadow:0 0 0 3px rgba(176,66,106,.10);">
                  <span style="{{ fields.kashiKamoku.style }}">{{ fields.kashiKamoku.text }}</span>
                  <span style="color:#9aa5b1;font-size:9px;flex:none;">▼</span>
                </button>
                <sc-if value="{{ active.kashiKamoku }}" hint-placeholder-val="{{ false }}">
                  <dc-import name="AssistPanel" groups="{{ assistGroups }}" query="{{ assist.query }}" empty="{{ assistEmpty }}" on-input="{{ onQueryInput }}" on-pick="{{ onPick }}" hint-size="270px,280px" style="position:absolute;top:calc(100% + 6px);left:0;width:100%;min-width:260px;z-index:60;"></dc-import>
                </sc-if>
              </div>
            </div>
            <div style="flex:1;min-width:200px;">
              <label style="display:block;font-size:10.5px;font-weight:600;color:#8290a0;margin-bottom:6px;">摘要</label>
              <div style="position:relative;display:flex;gap:5px;" data-assist>
                <input data-field="tekiyo" value="{{ form.tekiyo }}" onInput="{{ onFieldInput }}" placeholder="摘要を入力" autocomplete="off" style="flex:1;padding:10px 11px;border:1px solid #cfd8e0;border-radius:8px;font-size:14px;font-family:inherit;outline:none;color:#22303c;min-width:0;" style-focus="border-color:#2c5f9e;box-shadow:0 0 0 3px rgba(44,95,158,.10);" />
                <button type="button" data-field="tekiyo" data-type="summary" onClick="{{ openAssist }}" style="flex:none;width:38px;border:1px solid #cfd8e0;border-radius:8px;background:#eef2f5;cursor:pointer;color:#7a8794;font-size:9px;" style-hover="border-color:#2c5f9e;color:#2c5f9e;">▼</button>
                <sc-if value="{{ active.tekiyo }}" hint-placeholder-val="{{ false }}">
                  <dc-import name="AssistPanel" groups="{{ assistGroups }}" query="{{ assist.query }}" empty="{{ assistEmpty }}" on-input="{{ onQueryInput }}" on-pick="{{ onPick }}" hint-size="250px,240px" style="position:absolute;top:calc(100% + 6px);left:0;width:250px;z-index:60;"></dc-import>
                </sc-if>
              </div>
            </div>
            <div style="width:150px;flex:none;">
              <label style="display:block;font-size:10.5px;font-weight:600;color:#8290a0;margin-bottom:6px;">業者</label>
              <div style="position:relative;" data-assist>
                <button type="button" data-field="gyosha" data-type="vendor" onClick="{{ openAssist }}" style="display:flex;align-items:center;justify-content:space-between;gap:6px;width:100%;box-sizing:border-box;padding:10px 11px;background:#fff;border:1px solid #cfd8e0;border-radius:8px;font-size:13.5px;font-family:inherit;cursor:pointer;text-align:left;color:inherit;" style-hover="border-color:#2c5f9e;box-shadow:0 0 0 3px rgba(44,95,158,.10);">
                  <span style="{{ fields.gyosha.style }}">{{ fields.gyosha.text }}</span>
                  <span style="color:#9aa5b1;font-size:9px;flex:none;">▼</span>
                </button>
                <sc-if value="{{ active.gyosha }}" hint-placeholder-val="{{ false }}">
                  <dc-import name="AssistPanel" groups="{{ assistGroups }}" query="{{ assist.query }}" empty="{{ assistEmpty }}" on-input="{{ onQueryInput }}" on-pick="{{ onPick }}" hint-size="220px,220px" style="position:absolute;top:calc(100% + 6px);left:0;width:100%;min-width:200px;z-index:60;"></dc-import>
                </sc-if>
              </div>
            </div>
            <div style="width:150px;flex:none;">
              <label style="display:block;font-size:10.5px;font-weight:600;color:#8290a0;margin-bottom:6px;text-align:right;">金額</label>
              <input data-field="amount" value="{{ form.amountFmt }}" onInput="{{ onFieldInput }}" inputmode="numeric" placeholder="0" style="width:100%;box-sizing:border-box;text-align:right;font-size:16px;font-weight:700;padding:9px 11px;border:1px solid #cfd8e0;border-radius:8px;outline:none;font-family:inherit;background:#fff;color:#22303c;font-variant-numeric:tabular-nums;" style-focus="border-color:#2c5f9e;box-shadow:0 0 0 3px rgba(44,95,158,.10);" />
            </div>
            <button type="button" onClick="{{ submit }}" style="{{ submitStyle }}" style-hover="filter:brightness(.92);">登録</button>
          </div>
          <div style="min-height:18px;margin-top:9px;">
            <sc-if value="{{ err }}" hint-placeholder-val="{{ false }}">
              <span style="color:#c0392b;font-size:12.5px;font-weight:500;">{{ err }}</span>
            </sc-if>
          </div>
        </div>

        <!-- MONTH FILTER + RESULT -->
        <div style="padding:10px 22px;border-bottom:1px solid #eef2f5;display:flex;align-items:center;gap:12px;flex:none;">
          <span style="font-size:11px;color:#8895a3;font-weight:600;flex:none;">表示月</span>
          <div style="display:flex;gap:6px;flex-wrap:wrap;">
            <sc-for list="{{ monthChips }}" as="m" hint-placeholder-count="4">
              <button type="button" onClick="{{ m.onClick }}" style="{{ m.style }}">{{ m.label }}</button>
            </sc-for>
          </div>
          <span style="margin-left:auto;font-size:12px;color:#8895a3;flex:none;">検索結果 <b style="color:#22303c;font-weight:700;">{{ count }}</b> 件</span>
        </div>

        <!-- LEDGER -->
        <div style="display:grid;grid-template-columns:70px minmax(0,1.1fr) minmax(0,1.1fr) minmax(0,1.4fr) 118px;gap:14px;padding:10px 22px;background:#f6f8fa;font-size:10.5px;font-weight:700;color:#8290a0;border-bottom:1px solid #eef2f5;flex:none;">
          <div>月日</div><div>借方科目</div><div>貸方科目</div><div>摘要</div><div style="text-align:right;">金額</div>
        </div>
        <div id="journal-scroll" style="overflow-y:auto;flex:1;min-height:0;">
          <sc-if value="{{ isEmpty }}" hint-placeholder-val="{{ false }}">
            <div style="padding:48px 22px;text-align:center;color:#9aa5b1;font-size:13px;">該当する仕訳がありません。検索条件を変更してください。</div>
          </sc-if>
          <sc-for list="{{ journal }}" as="e" hint-placeholder-count="10">
            <div style="{{ e.rowStyle }}">
              <div style="color:#8895a3;font-size:12px;">{{ e.date }}</div>
              <div style="font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">{{ e.kari }}</div>
              <div style="color:#48565f;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">{{ e.kashi }}</div>
              <div style="color:#7a8794;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">{{ e.tekiyo }}</div>
              <div style="text-align:right;font-weight:700;font-variant-numeric:tabular-nums;">{{ e.amountFmt }}</div>
            </div>
          </sc-for>
        </div>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#2c5f9e&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#2c5f9e&quot;,&quot;#1f7a52&quot;,&quot;#b0592a&quot;,&quot;#5b4a8a&quot;],&quot;section&quot;:&quot;外観&quot;},&quot;journalDensity&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;standard&quot;,&quot;options&quot;:[&quot;standard&quot;,&quot;compact&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;仕訳帳&quot;}}">
const ACCOUNTS = [
  {group:'現金及び預金', items:['現金','普通預金（保育園）','当座預金（保育園）','小口現金']},
  {group:'事業未収金', items:['事業未収金','未収金','立替金','仮払金']},
  {group:'事業費', items:['保育材料費','給食費','水道光熱費（事業）','通信運搬費','賃借料（事業）','印刷製本費','消耗品費']},
  {group:'人件費', items:['職員俸給','法定福利費','特殊業務手当','扶養手当','時間外手当','通勤手当','その他手当']},
  {group:'事業収益', items:['委託費収益','その他の利用料収益','現金（収入）','受託事業収益','補助金収益']},
];
const SERVICES = ['001 本部','002 保育事業','003 子育て支援','004 一時預かり','005 地域支援'];
const VENDORS = ['（なし）','東京電力','ＮＴＴ東日本','中央リース','みどり商店','市役所','保護者'];
const SUMMARIES = ['健康保険','厚生年金','法定福利費','職員俸給','委託費ー８月分','電話料金','ガス代ー７月分','副食費ー保護者より','コピー代','夏祭り用品','振込手数料'];
const SEED = [
  {date:'8/1', kari:'健康保険', kashi:'普通預金（保育園）', tekiyo:'健康保険', amount:237873},
  {date:'8/1', kari:'厚生年金', kashi:'普通預金（保育園）', tekiyo:'厚生年金', amount:390886},
  {date:'8/1', kari:'法定福利費', kashi:'普通預金（保育園）', tekiyo:'健康保険・厚生年金', amount:670361},
  {date:'8/1', kari:'保育材料費', kashi:'普通預金（保育園）', tekiyo:'夏祭り用品', amount:12529},
  {date:'8/1', kari:'手数料', kashi:'小口現金', tekiyo:'振込手数料', amount:660},
  {date:'8/1', kari:'水道光熱費（事業）', kashi:'普通預金（保育園）', tekiyo:'水道料金', amount:23870},
  {date:'8/4', kari:'現金（収入）', kashi:'その他の利用料収益', tekiyo:'副食費ー保護者より', amount:4500},
  {date:'8/5', kari:'通信運搬費', kashi:'普通預金（保育園）', tekiyo:'電話料金', amount:8936},
  {date:'8/5', kari:'賃借料（事業）', kashi:'普通預金（保育園）', tekiyo:'冷凍冷蔵庫リース代', amount:18216},
  {date:'8/8', kari:'印刷製本費', kashi:'普通預金（保育園）', tekiyo:'コピー代', amount:10287},
];
const NAV = [
  {label:'ホーム', icon:'M3 11.5 12 4l9 7.5 M5.5 10v9.5h13V10'},
  {label:'自動で仕訳', icon:'M13 2 4 13h7v9l9-11h-7z'},
  {label:'手動で仕訳', icon:'M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z'},
  {label:'取引管理', icon:'M17 2l4 4-4 4 M21 6H7a4 4 0 0 0-4 4 M7 22l-4-4 4-4 M3 18h14a4 4 0 0 0 4-4'},
  {label:'会計帳簿', icon:'M5 4h13a1 1 0 0 1 1 1v15a1 1 0 0 1-1 1H6.5A1.5 1.5 0 0 1 5 19.5z M5 17h14', active:true},
  {label:'レポート', icon:'M6 20v-5 M12 20V8 M18 20v-9 M4 20h16'},
  {label:'決算・申告', icon:'M9 12l2 2 4-4 M6 3h9l5 5v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z'},
  {label:'書類管理', icon:'M3 7l2-3h5l2 3h7a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2z'},
  {label:'データ連携', icon:'M8 12h9 M13 8l4 4-4 4 M4 4v16'},
  {label:'各種設定', icon:'M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z M19.4 13a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2V21a2 2 0 0 1-4 0v-.1A1.7 1.7 0 0 0 7 19.3a1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0-1.2-2.9H1a2 2 0 0 1 0-4h.1A1.7 1.7 0 0 0 2.7 7a1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H7a1.7 1.7 0 0 0 1-1.5V1a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V7a1.7 1.7 0 0 0 1.5 1H23a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z'},
];

const MENU = [
  ['単一入力','伝票入力','振替入力','振替単一'],
  ['仕訳一覧','勘定元帳','資金元帳','業者元帳'],
  ['科目推移','資金推移','業者推移'],
  ['月次試算','予算対比','月次決算'],
  ['仕訳数'],
  ['日次調査','決算調査'],
  ['減価償却'],
  ['経年グラフ','分析グラフ','充実残額'],
  ['バージョン'],
  ['当年仕訳'],
  ['前年仕訳','元帳１','元帳２','残高照合'],
];
const ACTIVE_MENU = '伝票入力';

class Component extends DCLogic {
  constructor(props){
    super(props);
    let id = -1;
    this.state = {
      form: { service:'001 本部', month:'8', day:'5', torihiki:'事業', kariKamoku:'', kashiKamoku:'', tekiyo:'', gyosha:'', amount:'' },
      assist: { open:false, field:'', type:'', query:'' },
      journal: SEED.map(e => ({ ...e, id: id-- })),
      lastAdded: null, err:'', monthFilter:null,
      search: { keyword:'', kari:'', kashi:'', amountMin:'', amountMax:'' },
      applied: null,
    };
    this.nextId = 1;
  }
  componentDidMount(){
    this._down = (e) => {
      if (this.state.assist.open && !(e.target.closest && e.target.closest('[data-assist]')))
        this.setState(s => ({ assist: { ...s.assist, open:false } }));
    };
    document.addEventListener('mousedown', this._down, true);
  }
  componentWillUnmount(){ document.removeEventListener('mousedown', this._down, true); }
  componentDidUpdate(prevProps, prevState){
    if (this.state.lastAdded && this.state.lastAdded !== prevState.lastAdded){
      const el = document.getElementById('journal-scroll'); if (el) el.scrollTop = el.scrollHeight;
    }
  }
  rgba(hex, a){ const h=(hex||'#2c5f9e').replace('#',''); const f=h.length===3?h.split('').map(c=>c+c).join(''):h; const n=parseInt(f,16); return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')'; }
  fmt(v){ const n = parseInt(String(v).replace(/[^0-9]/g,''),10); return isNaN(n) ? '' : n.toLocaleString('ja-JP'); }
  mk(v, ph){ return { text: v || ph, style: { color: v ? '#22303c' : '#9aa5b1', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap', minWidth:0 } }; }
  buildMenu(orient){
    const AC = this.props.accent || '#2c5f9e';
    return MENU.map(function(group, gi){
      const items = group.map(function(label){
        const active = label === ACTIVE_MENU;
        if (orient === 'h'){
          return { label:label, active:active,
            style:{ padding:'6px 11px', fontSize:'13px', whiteSpace:'nowrap', fontFamily:'inherit', cursor:'pointer', background:'none', border:'none', borderBottom:'2px solid '+(active?AC:'transparent'), color:active?AC:'#5b6773', fontWeight:active?700:500 } };
        }
        return { label:label, active:active,
          style:{ display:'block', width:'100%', textAlign:'left', padding:'8px 12px', fontSize:'13px', fontFamily:'inherit', cursor:'pointer', background:active?'#eef2f6':'transparent', border:'none', borderLeft:'3px solid '+(active?AC:'transparent'), color:active?AC:'#5b6773', fontWeight:active?700:500 } };
      });
      let groupStyle;
      if (orient === 'h') groupStyle = { display:'flex', gap:'1px', flex:'none', marginLeft: gi===0?'0':'16px' };
      else groupStyle = { display:'flex', flexDirection:'column', paddingTop: gi===0?'0':'8px', marginTop: gi===0?'0':'8px', borderTop: gi===0?'none':'1px solid #eef2f5' };
      return { items:items, groupStyle:groupStyle };
    });
  }
  accountFlat(){ const a=[]; ACCOUNTS.forEach(g=>g.items.forEach(v=>a.push(v))); return a; }
  groups(){
    const a = this.state.assist; if (!a.open) return [];
    const q = (a.query||'').trim();
    const f = (arr) => q ? arr.filter(x => x.indexOf(q) >= 0) : arr;
    if (a.type === 'account') return ACCOUNTS.map(g => ({ group:g.group, hasHeader:true, items:f(g.items).map(v=>({value:v})) })).filter(g => g.items.length);
    if (a.type === 'service') return [{ group:'', hasHeader:false, items:f(SERVICES).map(v=>({value:v})) }];
    if (a.type === 'vendor')  return [{ group:'', hasHeader:false, items:f(VENDORS).map(v=>({value:v})) }];
    if (a.type === 'summary') return [{ group:'よく使う摘要', hasHeader:true, items:f(SUMMARIES).map(v=>({value:v})) }];
    return [];
  }
  activeMap(){
    const a = this.state.assist;
    const m = (fl) => a.open && a.field === fl;
    return { service:m('service'), kariKamoku:m('kariKamoku'), kashiKamoku:m('kashiKamoku'), gyosha:m('gyosha'), tekiyo:m('tekiyo') };
  }
  chips(){
    const cur = this.state.form.torihiki, AC = this.props.accent || '#2c5f9e';
    return ['資金','事業','その他'].map(l => {
      const on = cur === l;
      return { label:l, onClick:()=>this.setTorihiki(l),
        style:{ padding:'6px 14px', fontSize:'12.5px', fontWeight:600, borderRadius:'20px', cursor:'pointer', fontFamily:'inherit', transition:'all .12s', background:on?AC:'#fff', color:on?'#fff':'#5b6773', border:'1px solid '+(on?AC:'#cfd8e0') } };
    });
  }
  monthChips(){
    const st = this.state, AC = this.props.accent || '#2c5f9e';
    const months = [...new Set(st.journal.map(e => String(e.date).split('/')[0]))].sort((a,b)=>parseInt(a,10)-parseInt(b,10));
    const opts = [{label:'全月', value:null}, ...months.map(m=>({label:m+'月', value:m}))];
    return opts.map(o => {
      const on = st.monthFilter === o.value;
      return { label:o.label, onClick:()=>this.setMonth(o.value),
        style:{ padding:'4px 12px', fontSize:'11.5px', fontWeight:600, borderRadius:'16px', cursor:'pointer', fontFamily:'inherit', transition:'all .12s', background:on?AC:'#fff', color:on?'#fff':'#5b6773', border:'1px solid '+(on?AC:'#d3dbe3') } };
    });
  }
  filtered(){
    const st = this.state;
    let list = st.journal;
    if (st.monthFilter != null) list = list.filter(e => String(e.date).split('/')[0] === st.monthFilter);
    const ap = st.applied;
    if (ap){
      const kw = (ap.keyword||'').trim();
      if (kw) list = list.filter(e => [e.kari, e.kashi, e.tekiyo].some(x => String(x||'').indexOf(kw) >= 0));
      if (ap.kari) list = list.filter(e => e.kari === ap.kari);
      if (ap.kashi) list = list.filter(e => e.kashi === ap.kashi);
      const mn = parseInt(ap.amountMin,10), mx = parseInt(ap.amountMax,10);
      if (!isNaN(mn)) list = list.filter(e => e.amount >= mn);
      if (!isNaN(mx)) list = list.filter(e => e.amount <= mx);
    }
    return list;
  }
  journalView(){
    const density = this.props.journalDensity || 'standard';
    const pad = density === 'compact' ? '7px 22px' : '11px 22px';
    return this.filtered().map(e => {
      const isNew = e.id === this.state.lastAdded;
      return { ...e, amountFmt: e.amount.toLocaleString('ja-JP'),
        rowStyle:{ display:'grid', gridTemplateColumns:'70px minmax(0,1.1fr) minmax(0,1.1fr) minmax(0,1.4fr) 118px', gap:'14px', padding:pad, borderBottom:'1px solid #f1f4f6', fontSize:'12.5px', alignItems:'center', background:isNew?'#fff2c9':'transparent', animation:isNew?'rowin 1.8s ease':'none' } };
    });
  }
  openAssist = (e) => {
    const t = e.currentTarget;
    this.setState({ assist: { open:true, field:t.dataset.field, type:t.dataset.type, query:'' } });
    setTimeout(() => { const el = document.getElementById('assist-search'); if (el) el.focus(); }, 30);
  };
  onQueryInput = (e) => { const q = e.target.value; this.setState(s => ({ assist: { ...s.assist, query:q } })); };
  onPick = (e) => {
    const raw = e.currentTarget.dataset.value, a = this.state.assist, val = raw === '（なし）' ? '' : raw;
    this.setState(s => ({ form: { ...s.form, [a.field]: val }, assist: { ...s.assist, open:false }, err:'' }));
  };
  onFieldInput = (e) => {
    const t = e.target, field = t.dataset.field; let val = t.value;
    if (field === 'amount') val = val.replace(/[^0-9]/g,'');
    if (field === 'month' || field === 'day') val = val.replace(/[^0-9]/g,'').slice(0,2);
    this.setState(s => ({ form: { ...s.form, [field]: val }, err:'' }));
  };
  onSearchInput = (e) => {
    const t = e.target, field = t.dataset.field; let val = t.value;
    if (field === 'amountMin' || field === 'amountMax') val = val.replace(/[^0-9]/g,'');
    this.setState(s => ({ search: { ...s.search, [field]: val } }));
  };
  onSearchKey = (e) => { if (e.key === 'Enter') this.doSearch(); };
  doSearch = () => { this.setState(s => ({ applied: { ...s.search } })); };
  clearSearch = () => { this.setState({ search:{ keyword:'', kari:'', kashi:'', amountMin:'', amountMax:'' }, applied:null, monthFilter:null }); };
  setTorihiki = (l) => { this.setState(s => ({ form: { ...s.form, torihiki: s.form.torihiki === l ? '' : l } })); };
  setMonth = (m) => { this.setState({ monthFilter: m }); };
  submit = () => {
    const f = this.state.form;
    if (!f.kariKamoku || !f.kashiKamoku || !f.amount){ this.setState({ err:'借方科目・貸方科目・金額を入力してください。' }); return; }
    const id = this.nextId++;
    const entry = { id, date:(f.month||'')+'/'+(f.day||''), kari:f.kariKamoku, kashi:f.kashiKamoku, tekiyo:f.tekiyo||'', amount:parseInt(f.amount,10)||0 };
    this.setState(s => ({ journal:[...s.journal, entry], form:{ ...s.form, kariKamoku:'', kashiKamoku:'', tekiyo:'', gyosha:'', amount:'' }, lastAdded:id, err:'', applied:null, search:{ keyword:'', kari:'', kashi:'', amountMin:'', amountMax:'' }, monthFilter: (s.monthFilter != null && s.monthFilter !== (f.month||'')) ? (f.month||'') : s.monthFilter }));
  };
  renderVals(){
    const st = this.state, f = st.form, AC = this.props.accent || '#2c5f9e';
    const grp = this.groups();
    const view = this.journalView();
    return {
      accent: AC,
      menuGroups: this.buildMenu('v'),
      accountOptions: this.accountFlat(),
      search: st.search,
      form: { ...f, amountFmt: this.fmt(f.amount) },
      fields: { service:this.mk(f.service,'選択'), kariKamoku:this.mk(f.kariKamoku,'科目を選択'), kashiKamoku:this.mk(f.kashiKamoku,'科目を選択'), gyosha:this.mk(f.gyosha,'業者を選択') },
      assist: st.assist, assistGroups: grp,
      assistEmpty: st.assist.open && grp.reduce((n,g)=>n+g.items.length,0) === 0,
      active: this.activeMap(), torihiki: this.chips(), monthChips: this.monthChips(),
      journal: view, count: view.length, isEmpty: view.length === 0, err: st.err,
      submitStyle: { height:'40px', background:AC, color:'#fff', border:'none', borderRadius:'8px', fontWeight:700, fontSize:'14px', fontFamily:'inherit', cursor:'pointer' },
      searchBtnStyle: { padding:'9px 26px', background:AC, color:'#fff', border:'none', borderRadius:'8px', fontWeight:700, fontSize:'13px', fontFamily:'inherit', cursor:'pointer', boxShadow:'0 2px 8px '+this.rgba(AC,0.28) },
      openAssist: this.openAssist, onQueryInput: this.onQueryInput, onPick: this.onPick, onFieldInput: this.onFieldInput, submit: this.submit,
      onSearchInput: this.onSearchInput, onSearchKey: this.onSearchKey, doSearch: this.doSearch, clearSearch: this.clearSearch,
    };
  }
}
</script>
